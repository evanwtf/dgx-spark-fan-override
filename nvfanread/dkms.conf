PACKAGE_NAME="nvfanread"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="nvfanread"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"

# Sign the freshly built module with the machine's MOK after every build
# (install + kernel-update autoinstall), so it loads under Secure Boot.
POST_BUILD="dkms-sign.sh"
