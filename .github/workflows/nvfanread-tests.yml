name: nvfanread unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    # GitHub-hosted: this repo is public, so standard-runner minutes are free
    # and unlimited. The tests are pure portable C and need no special host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The pure protocol logic is kernel- and hardware-independent, so the
      # unit tests build and run with just a C compiler.
      - name: Run protocol unit tests
        run: make -C nvfanread/tests test
