name: nvfanread unit tests

on:
  push:
    paths:
      - 'nvfanread/**'
      - '.github/workflows/nvfanread-tests.yml'
  pull_request:
    paths:
      - 'nvfanread/**'
      - '.github/workflows/nvfanread-tests.yml'

jobs:
  unit-tests:
    # Org self-hosted runner (matches evanwtf/local-llm). The tests are pure
    # portable C, so any Linux X64 runner works; keeps CI off metered minutes.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      # The pure protocol logic is kernel- and hardware-independent, so the
      # unit tests build and run with just a C compiler.
      - name: Run protocol unit tests
        run: make -C nvfanread/tests test
