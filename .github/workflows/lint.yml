name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # checkpatch is a kernel-tree tool and is absent here, so scripts/lint.sh
      # skips it and enforces shellcheck. Developers run checkpatch locally via
      # `make lint` on a machine with kernel headers.
      - name: Lint
        run: sh scripts/lint.sh
